<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --surface-2: #f8f8f7;
    --ink: #111111;
    --muted: #6f6f6a;
    --muted-2: #9b9b96;
    --line: #deded9;
    --line-strong: #c8c8c2;
    --black: #111111;
    --danger: #b42318;
    --danger-bg: #fff5f3;
    --success: #1c7c54;
    --shadow: 0 18px 60px rgba(15, 15, 15, 0.10);
    --sidebar-left: 268px;
    --sidebar-right: 326px;
    --topbar: 58px;
    --radius: 12px;
    --radius-sm: 8px;
    font-synthesis: none;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  button, input, textarea, select { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  .hidden { display: none !important; }
  .mobile-only { display: none; }

  .app-shell { min-height: 100vh; }
  .topbar {
    height: var(--topbar);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    padding: 0 14px;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 30;
  }
  .brand-group, .topbar-actions, .topbar-center, .device-switch, .mode-switch { display: flex; align-items: center; }
  .brand-group { gap: 10px; min-width: 0; }
  .brand-mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: #111; color: #fff; font-weight: 800; letter-spacing: -.03em; }
  .brand-name { font-size: 13px; font-weight: 750; letter-spacing: -.01em; }
  .brand-sub { color: var(--muted); font-size: 10px; margin-top: 1px; }
  .topbar-center { justify-content: center; gap: 8px; }
  .topbar-actions { justify-content: flex-end; gap: 7px; min-width: 0; }
  .divider-v { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }

  .button, .icon-btn, .seg-btn, .text-btn, .segmented button {
    border: 0;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .15s ease, opacity .15s ease;
  }
  .button { min-height: 34px; padding: 0 12px; border-radius: 8px; font-weight: 650; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
  .button.primary { background: var(--black); color: #fff; }
  .button.primary:hover { background: #2a2a2a; }
  .button.secondary, .button.ghost { background: #fff; border: 1px solid var(--line); }
  .button.secondary:hover, .button.ghost:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .button.danger { color: var(--danger); background: var(--danger-bg); border: 1px solid #f3c6bf; }
  .button:disabled, .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  .icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: transparent; font-size: 16px; }
  .icon-btn:hover { background: #f1f1ef; }
  .icon-btn.device-btn { font-size: 18px; color: var(--muted); }
  .icon-btn.device-btn.active { background: #111; color: #fff; }
  .mode-switch { padding: 3px; border-radius: 9px; background: #efefec; }
  .seg-btn { min-height: 28px; padding: 0 11px; border-radius: 7px; background: transparent; font-size: 11px; font-weight: 700; color: var(--muted); }
  .seg-btn.active { background: #fff; color: #111; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .text-btn { background: none; font-size: 11px; color: var(--muted); padding: 4px 5px; }
  .text-btn:hover { color: var(--ink); }

  .workspace { height: calc(100vh - var(--topbar)); display: grid; grid-template-columns: var(--sidebar-left) minmax(0, 1fr) var(--sidebar-right); grid-template-areas: "left canvas inspector"; }
  .sidebar { min-width: 0; background: var(--surface); overflow: auto; position: relative; z-index: 12; }
  .left-panel { grid-area: left; border-right: 1px solid var(--line); }
  .inspector-panel { grid-area: inspector; border-left: 1px solid var(--line); }
  .panel-heading { min-height: 70px; padding: 16px 14px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel-heading h2 { margin: 2px 0 0; font-size: 14px; letter-spacing: -.02em; }
  .eyebrow { font-size: 9px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-2); font-weight: 800; }
  .import-actions { padding: 0 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .file-button { position: relative; overflow: hidden; }

  .page-list { padding: 2px 8px 12px; }
  .page-item { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; align-items: center; gap: 7px; width: 100%; min-height: 38px; padding: 4px 5px 4px 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; }
  .page-item:hover { background: #f6f6f4; }
  .page-item.active { background: #f0f0ed; border-color: var(--line); }
  .page-icon { width: 20px; height: 20px; border: 1px solid var(--line-strong); border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: var(--muted); background: #fff; }
  .page-meta { min-width: 0; text-align: left; }
  .page-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 650; }
  .page-detail { display: block; margin-top: 1px; color: var(--muted-2); font-size: 9px; }
  .page-menu-btn { opacity: 0; }
  .page-item:hover .page-menu-btn, .page-item.active .page-menu-btn { opacity: 1; }

  .panel-section { border-top: 1px solid var(--line); padding: 14px 12px; }
  .analysis-section { margin-top: 4px; }
  .section-title-row { display: flex; align-items: center; justify-content: space-between; }
  .section-title-row h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .status-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--success); }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; }
  .stat-card { padding: 8px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); }
  .stat-value { font-size: 14px; font-weight: 760; }
  .stat-label { margin-top: 2px; font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .issue-list { display: grid; gap: 6px; margin-top: 10px; }
  .issue-card { display: grid; grid-template-columns: 8px 1fr; gap: 7px; align-items: start; padding: 8px; background: #fbfbf9; border: 1px solid var(--line); border-radius: 7px; }
  .issue-dot { width: 6px; height: 6px; border-radius: 999px; margin-top: 4px; background: #c67700; }
  .issue-card.good .issue-dot { background: var(--success); }
  .issue-text { font-size: 10px; line-height: 1.35; color: #4d4d49; }

  .canvas-area { grid-area: canvas; min-width: 0; display: grid; grid-template-rows: 42px minmax(0,1fr); background: #ededeb; }
  .canvas-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; border-bottom: 1px solid #d5d5d1; background: #f5f5f3; }
  .canvas-title-wrap, .canvas-meta { min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); }
  .canvas-title-wrap > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .safe-pill { font-size: 8px; font-weight: 800; letter-spacing: .08em; border: 1px solid var(--line-strong); padding: 3px 5px; border-radius: 999px; color: #555; background: #fff; }
  .canvas-stage { min-height: 0; position: relative; overflow: auto; padding: 26px; display: grid; place-items: center; background-image: linear-gradient(#dfdfdc 1px, transparent 1px), linear-gradient(90deg, #dfdfdc 1px, transparent 1px); background-size: 20px 20px; }
  .empty-state { max-width: 560px; text-align: center; padding: 54px 32px; background: rgba(255,255,255,.93); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .empty-icon { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 15px; background: #111; color: #fff; font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty-state h1 { margin: 0; font-size: clamp(26px, 4vw, 42px); letter-spacing: -.055em; line-height: 1; }
  .empty-state p { max-width: 420px; margin: 14px auto 20px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .empty-actions { display: flex; justify-content: center; gap: 8px; }
  .feature-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 26px; color: var(--muted-2); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }

  .preview-shell { width: 100%; height: 100%; display: grid; place-items: center; }
  .preview-frame-wrap { background: #fff; border: 1px solid #bdbdb8; box-shadow: 0 20px 70px rgba(0,0,0,.14); overflow: hidden; transition: width .2s ease, height .2s ease, border-radius .2s ease; width: 100%; height: 100%; min-height: 520px; }
  .preview-shell[data-device="tablet"] .preview-frame-wrap { width: min(768px, 100%); height: min(1024px, 100%); border-radius: 18px; }
  .preview-shell[data-device="mobile"] .preview-frame-wrap { width: min(390px, 100%); height: min(844px, 100%); border-radius: 24px; }
  #previewFrame { display: block; width: 100%; height: 100%; min-height: 520px; border: 0; background: #fff; }
  .loading-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 9px; background: rgba(244,244,242,.72); backdrop-filter: blur(2px); z-index: 9; font-size: 11px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; border-top-color: #111; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .inspector-heading { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); }
  .inspector-empty { min-height: 300px; padding: 50px 28px; display: grid; place-items: center; align-content: center; text-align: center; color: var(--muted); }
  .inspector-empty p { max-width: 210px; font-size: 11px; line-height: 1.6; }
  .cursor-glyph { font-size: 34px; color: #b4b4af; }
  .selection-path { padding: 10px 12px; font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: #fafaf8; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .control-section { border-bottom: 1px solid var(--line); }
  .section-toggle { width: 100%; height: 40px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 0; background: #fff; cursor: pointer; font-size: 11px; font-weight: 760; }
  .section-toggle:hover { background: #fafaf8; }
  .section-toggle span:last-child { color: var(--muted-2); transition: transform .2s ease; }
  .section-toggle.collapsed span:last-child { transform: rotate(180deg); }
  .section-body { padding: 0 12px 13px; }
  .section-body.collapsed { display: none; }
  .field-label { display: block; margin: 9px 0 5px; color: #555550; font-size: 9px; font-weight: 750; text-transform: uppercase; letter-spacing: .055em; }
  .field { width: 100%; min-height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: #fff; color: #111; font-size: 11px; }
  .field:hover { border-color: var(--line-strong); }
  .field:focus { border-color: #111; outline: none; box-shadow: 0 0 0 1px #111; }
  textarea.field { resize: vertical; line-height: 1.45; }
  .field-help { margin-top: 5px; color: var(--muted-2); font-size: 9px; line-height: 1.35; }
  .field-grid { display: grid; gap: 8px; }
  .field-grid.two { grid-template-columns: 1fr 1fr; }
  .field-grid.three { grid-template-columns: 1fr 1fr .8fr; }
  .compact-grid .field-label { letter-spacing: .02em; }
  .unit-field { display: grid; grid-template-columns: 1fr 25px; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .unit-field .field { border: 0; border-radius: 0; min-width: 0; }
  .unit-field span { font-size: 9px; color: var(--muted); text-align: center; }
  .color-field { display: grid; grid-template-columns: 34px 1fr; gap: 7px; }
  .color-field input[type="color"], #borderColorInput { width: 34px; height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 3px; background: #fff; cursor: pointer; }
  .segmented { display: flex; gap: 2px; padding: 3px; background: #f1f1ef; border-radius: 8px; }
  .segmented.full button { flex: 1; min-height: 27px; background: transparent; border-radius: 6px; font-size: 9px; }
  .segmented.full button.active { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .check-row { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 10px; color: var(--muted); }
  .conditional-controls { margin-top: 8px; padding-top: 5px; border-top: 1px dashed var(--line); }
  .compact-actions { padding: 12px; }
  .action-row { display: flex; gap: 7px; }
  .grow { flex: 1; }

  /* Workspace library: Pages / Elements / Media */
  .library-heading { padding-bottom: 9px; }
  .library-tabs { position: sticky; top: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 5px 8px 7px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  .library-tab { min-height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px; font-weight: 720; }
  .library-tab:hover { background: #f5f5f3; color: var(--ink); }
  .library-tab.active { background: #111; color: #fff; }
  .library-view { min-height: 0; padding-bottom: 18px; }
  .library-controls { padding: 10px 10px 12px; border-bottom: 1px solid var(--line); background: #fff; }
  .library-controls .field + .field { margin-top: 7px; }
  .sticky-library-controls { position: sticky; top: 43px; z-index: 5; }
  .element-catalog { padding: 4px 9px 18px; }
  .element-group { padding: 12px 0 4px; }
  .element-group + .element-group { border-top: 1px solid var(--line); }
  .element-group-title { margin-bottom: 8px; color: #555550; font-size: 9px; font-weight: 820; letter-spacing: .08em; text-transform: uppercase; }
  .element-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .element-tile { min-height: 68px; padding: 9px 6px; display: grid; place-items: center; align-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #393936; cursor: pointer; font-size: 9px; font-weight: 680; }
  .element-tile:hover { border-color: #9f9f98; background: #f8f8f6; transform: translateY(-1px); }
  .element-tile.filtered-out { display: none; }
  .element-glyph { width: 28px; height: 25px; display: grid; place-items: center; border-radius: 6px; background: #f1f1ef; color: #111; font-size: 16px; font-weight: 700; }
  .full-width-button { width: 100%; }

  /* Media library */
  .media-drive-box { padding: 11px 10px 10px; border-bottom: 1px solid var(--line); background: #fbfbf9; }
  .media-folder-grid { grid-template-columns: minmax(0,1fr) auto !important; margin-top: 7px; }
  .media-drive-actions { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; margin-top: 7px; }
  .media-drive-actions .button { min-width: 0; text-align: center; }
  .media-operation-status { min-height: 13px; margin-top: 7px; }
  .media-operation-status.busy { color: #8b6817; }
  .media-operation-status.success { color: #178353; }
  .media-operation-status.error { color: var(--danger); }
  .media-upload-zone { padding: 11px 10px 10px; border-bottom: 1px solid var(--line); }
  .media-url-box { padding: 10px; border-bottom: 1px solid var(--line); }
  .media-url-grid { grid-template-columns: 1fr auto !important; margin-bottom: 7px; }
  .media-library-head { padding: 12px 10px 3px; }
  .media-grid { padding: 5px 9px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .media-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #fff; cursor: pointer; }
  .media-card:hover { border-color: #999; box-shadow: 0 5px 16px rgba(0,0,0,.06); }
  .media-thumb { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; background: #f1f1ef; color: #666; }
  .media-thumb img, .media-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .media-thumb audio { width: calc(100% - 10px); }
  .media-kind-glyph { font-size: 24px; }
  .media-card-meta { min-width: 0; padding: 7px; border-top: 1px solid var(--line); }
  .media-card-name { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 9px; font-weight: 700; }
  .media-card-size { display: block; margin-top: 2px; color: var(--muted-2); font-size: 8px; }
  .media-card-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; padding: 0 6px 6px; }
  .media-card-actions button { min-height: 25px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 8px; }
  .media-card-actions button:hover { background: #f4f4f2; }
  .media-card-actions .media-remove, .media-card-actions .media-drive-link { width: 27px; color: var(--danger); }
  .media-card-actions .media-drive-link { color: #444; display:grid; place-items:center; text-decoration:none; min-height:25px; border:1px solid var(--line); border-radius:6px; background:#fff; font-size:10px; }

  /* Typography and icon controls */
  .font-family-select { font-weight: 600; }
  .inline-field-action { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .inline-field-action .button { min-height: 32px; }
  .no-margin { margin: 0; }
  .compact-title-row { margin-top: 3px; }
  .icon-fill-row { align-self: end; min-height: 32px; margin-bottom: 0; }

  /* Material Symbol chooser */
  .icon-picker-card { width: min(660px, 100%); }
  .icon-picker-grid { max-height: 420px; overflow: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; margin-top: 10px; padding: 2px; }
  .icon-pick { min-width: 0; min-height: 72px; padding: 7px 4px; display: grid; place-items: center; align-content: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .icon-pick:hover { border-color: #999; background: #fafaf8; }
  .icon-pick-symbol { font-family: 'Material Symbols Outlined'; font-size: 25px; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga'; }
  .icon-pick-name { max-width: 74px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 7px; }
  .icon-picker-help { margin-top: 10px; }

  .drawer-backdrop { position: fixed; inset: var(--topbar) 0 0; background: rgba(0,0,0,.22); z-index: 39; }
  .code-drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: min(70vh, 760px); background: #111; color: #fff; transform: translateY(100%); transition: transform .22s ease; box-shadow: 0 -20px 80px rgba(0,0,0,.25); display: grid; grid-template-rows: 58px 1fr; }
  .code-drawer.open { transform: translateY(0); }
  .code-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 14px; border-bottom: 1px solid #333; }
  .code-drawer-head h2 { margin: 2px 0 0; font-size: 13px; }
  .code-drawer .eyebrow { color: #777; }
  .code-actions { display: flex; align-items: center; gap: 7px; }
  .code-drawer .button.secondary { background: #1e1e1e; border-color: #3b3b3b; color: #fff; }
  .code-drawer .icon-btn { color: #fff; }
  .code-status { font-size: 9px; color: #8f8f8f; margin-right: 4px; }
  .code-status.dirty { color: #ffcc72; }
  .code-editor { width: 100%; height: 100%; border: 0; outline: 0; resize: none; padding: 18px; background: #111; color: #e7e7e7; caret-color: #fff; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; white-space: pre; overflow: auto; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(20,20,20,.45); backdrop-filter: blur(5px); }
  .modal-card { width: min(520px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: #fff; border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .modal-card.large { width: min(820px, 100%); }
  .modal-head { min-height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 2px 0 0; font-size: 16px; letter-spacing: -.02em; }
  .modal-body { padding: 12px 14px 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 7px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .paste-area { min-height: 320px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .export-options { display: grid; gap: 8px; }
  .export-option { width: 100%; display: grid; grid-template-columns: 42px 1fr; gap: 10px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
  .export-option:hover { border-color: #aaa; background: #fafaf8; }
  .export-icon { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: #111; color: #fff; font-size: 17px; }
  .export-option strong { display: block; font-size: 12px; }
  .export-option small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }

  .toast-region { position: fixed; right: 14px; bottom: 14px; z-index: 120; display: grid; gap: 7px; pointer-events: none; }
