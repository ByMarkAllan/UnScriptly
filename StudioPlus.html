<script>
(function () {
  'use strict';

  var BUILD = '8.11.0-drive-media-library-20260827';
  var selection = null;
  var lastPreviewToken = '';
  var silentDepth = 0;

  function $(id) { return document.getElementById(id); }
  function qsa(selector, root) { return Array.prototype.slice.call((root || document).querySelectorAll(selector)); }

  function toast(message, type) {
    var region = $('toastRegion');
    if (!region) return;
    var node = document.createElement('div');
    node.className = 'toast' + (type === 'error' ? ' error' : '');
    node.textContent = String(message || '');
    region.appendChild(node);
    window.setTimeout(function () {
      node.style.opacity = '0';
      node.style.transform = 'translateY(5px)';
      window.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 180);
    }, 2800);
  }

  function setBadge(state, text, title) {
    var badge = $('buildStatusBadge');
    if (!badge) return;
    badge.className = 'build-badge ' + state;
    badge.textContent = text;
    badge.title = title || '';
  }

  function probeV1Core() {
    var interact = $('interactModeBtn');
    var select = $('selectModeBtn');
    var pageList = $('pageList');
    if (!interact || !select || !pageList) return false;
    var wasSelect = select.classList.contains('active');
    interact.click();
    var responded = interact.classList.contains('active');
    select.click();
    if (!wasSelect && responded) interact.click();
    return responded && pageList.children.length > 0;
  }

  function verifyServer() {
    if (!(window.google && google.script && google.script.run)) {
      setBadge('ready', 'v8.11.0 · CORE READY', 'The immutable v1 core is running. Server handshake unavailable outside Apps Script.');
      return;
    }
    google.script.run
      .withSuccessHandler(function (info) {
        var server = info && info.build ? String(info.build) : '';
        if (server === BUILD) setBadge('ready', 'v8.11.0 · READY', 'Immutable v1 core + v8.11 Drive Media Library + element export/link/social/component extensions + matching Code.gs are running.');
        else setBadge('warn', 'v8.11.0 · SERVER MISMATCH', 'Client ' + BUILD + ' / server ' + (server || 'unknown'));
      })
      .withFailureHandler(function (error) {
        setBadge('warn', 'v8.11.0 · SERVER CHECK FAILED', String(error && error.message || error || 'Build check failed'));
      })
      .htmlStudioGetBuildInfo();
  }

  function beginSilent() {
    silentDepth++;
    document.documentElement.classList.add('studio-plus-silent');
  }
  function endSilent() {
    silentDepth = Math.max(0, silentDepth - 1);
    if (!silentDepth) document.documentElement.classList.remove('studio-plus-silent');
  }

  function hasPage() {
    var shell = $('previewShell');
    return !!(shell && !shell.classList.contains('hidden'));
  }

  function readSource() {
    if (!hasPage()) return '';
    var codeBtn = $('codeBtn');
    var editor = $('codeEditor');
    var closeBtn = $('closeCodeBtn');
    if (!codeBtn || !editor || !closeBtn) return '';
    beginSilent();
    try {
      codeBtn.click();
      var source = String(editor.value || '');
      closeBtn.click();
      return source;
    } catch (error) {
      console.error('[HTML Studio Plus] source read failed:', error);
      try { closeBtn.click(); } catch (_) {}
      return '';
    } finally {
      window.setTimeout(endSilent, 0);
    }
  }

  function withSource(mutator, successMessage) {
    if (!hasPage()) {
      toast('Import or create a page first.', 'error');
      return false;
    }
    var codeBtn = $('codeBtn');
    var editor = $('codeEditor');
    var applyBtn = $('applyCodeBtn');
    var closeBtn = $('closeCodeBtn');
    if (!codeBtn || !editor || !applyBtn || !closeBtn) {
      toast('Source editor is unavailable.', 'error');
      return false;
    }
    beginSilent();
    try {
      codeBtn.click();
      var before = String(editor.value || '');
      var after = mutator(before);
      if (typeof after !== 'string' || after === before) {
        closeBtn.click();
        return false;
      }
      editor.value = after;
      editor.dispatchEvent(new Event('input', { bubbles: true }));
      applyBtn.click();
      closeBtn.click();
      if (successMessage) toast(successMessage);
      return true;
    } catch (error) {
      console.error('[HTML Studio Plus] source patch failed:', error);
      try { closeBtn.click(); } catch (_) {}
      toast('That change could not be applied.', 'error');
      return false;
    } finally {
      window.setTimeout(endSilent, 0);
    }
  }

  function parseSource(source) {
    var parser = new DOMParser();
    return parser.parseFromString(String(source || ''), 'text/html');
  }

  function serializeSource(doc, original) {
    var prefix = /^\s*<!doctype\s+html[^>]*>/i.test(String(original || '')) ? '<!DOCTYPE html>\n' : '';
    return prefix + doc.documentElement.outerHTML;
  }

  function selectedTarget(doc) {
    if (!selection) return null;
    if (selection.id) {
      var byId = doc.getElementById(selection.id);
      if (byId) return byId;
    }
    if (selection.path) {
      try {
        var byPath = doc.querySelector(selection.path);
        if (byPath) return byPath;
      } catch (_) {}
    }
    if (selection.tag) {
      var candidates = qsa(selection.tag, doc);
      if (selection.classes && selection.classes.length) {
        for (var i = 0; i < candidates.length; i++) {
          var ok = true;
          for (var j = 0; j < selection.classes.length; j++) {
            if (!candidates[i].classList.contains(selection.classes[j])) { ok = false; break; }
          }
          if (ok) return candidates[i];
        }
      }
      return candidates[0] || null;
    }
    return null;
  }

  function ensureStylesheet(doc, href, key) {
    href = String(href || '').trim();
    if (!href) return;
    var links = qsa('link[rel="stylesheet"]', doc);
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === href || (key && links[i].getAttribute('data-unscriptly-asset') === key)) return;
    }
    var link = doc.createElement('link');
    link.setAttribute('rel', 'stylesheet');
    link.setAttribute('href', href);
    if (key) link.setAttribute('data-unscriptly-asset', key);
    (doc.head || doc.documentElement).appendChild(link);
  }

  function patchSelected(mutator, options) {
    options = options || {};
    if (!selection) {
      toast('Select an element in the preview first.', 'error');
      return false;
    }
    return withSource(function (source) {
      var doc = parseSource(source);
      var target = selectedTarget(doc);
      if (!target) throw new Error('Selected element could not be mapped to source.');
      mutator(target, doc);
      if (options.stylesheetUrl) ensureStylesheet(doc, options.stylesheetUrl, options.stylesheetKey || 'asset');
      return serializeSource(doc, source);
    }, options.message || 'Element updated.');
  }

  function styleSelected(property, value, options) {
    return patchSelected(function (target) {
      if (value === '' || value == null) target.style.removeProperty(property);
      else target.style.setProperty(property, String(value));
    }, options || {});
  }

  function attrSelected(attribute, value, options) {
    return patchSelected(function (target) {
      if (value === '' || value == null || value === false) target.removeAttribute(attribute);
      else if (value === true) target.setAttribute(attribute, '');
      else target.setAttribute(attribute, String(value));
    }, options || {});
  }

  function textSelected(value, options) {
    return patchSelected(function (target) { target.textContent = String(value == null ? '' : value); }, options || {});
  }

  function canContain(el) {
    return !!el && ['AREA','BASE','BR','COL','EMBED','HR','IMG','INPUT','LINK','META','PARAM','SOURCE','TRACK','WBR'].indexOf(el.tagName) < 0;
  }
  function smartContainer(el) {
    return !!el && ['BODY','MAIN','SECTION','ARTICLE','HEADER','FOOTER','NAV','DIV','ASIDE','FORM','LI','UL','OL','TD','TH'].indexOf(el.tagName) >= 0;
  }

  function insertHtml(html, position, options) {
    options = options || {};
    return withSource(function (source) {
      var doc = parseSource(source);
      if (options.stylesheetUrl) ensureStylesheet(doc, options.stylesheetUrl, options.stylesheetKey || 'asset');
      var template = doc.createElement('template');
      template.innerHTML = String(html || '').trim();
      var fragment = template.content;
      if (!fragment || !fragment.childNodes.length) return source;
      var target = selectedTarget(doc);
      var pos = String(position || 'smart');
      if (pos === 'body' || !target) doc.body.appendChild(fragment);
      else if (pos === 'before' && target.parentNode) target.parentNode.insertBefore(fragment, target);
      else if (pos === 'after' && target.parentNode) target.parentNode.insertBefore(fragment, target.nextSibling);
      else if (pos === 'inside') {
        if (canContain(target)) target.appendChild(fragment);
        else if (target.parentNode) target.parentNode.insertBefore(fragment, target.nextSibling);
      } else if (smartContainer(target)) target.appendChild(fragment);
      else if (target.parentNode) target.parentNode.insertBefore(fragment, target.nextSibling);
      else doc.body.appendChild(fragment);
      return serializeSource(doc, source);
    }, options.message || 'Element added.');
  }

  function readTextFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || '')); };
      reader.onerror = function () { reject(reader.error || new Error('File could not be read.')); };
      reader.readAsText(file);
    });
  }

  function importFilesThroughV1(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return Promise.resolve();
    return Promise.all(list.map(function (file) {
      return readTextFile(file).then(function (html) {
        var name = String(file.name || 'index.html').replace(/\.txt$/i, '.html');
        return { name: name, html: html };
      });
    })).then(function (items) {
      items.forEach(function (item) {
        $('pastePageName').value = item.name;
        $('pasteHtmlInput').value = item.html;
        $('importPasteBtn').click();
      });
      toast(items.length + ' page' + (items.length === 1 ? '' : 's') + ' imported.');
    });
  }

  function installTxtImport() {
    var input = $('fileInput');
    if (!input) return;
    input.setAttribute('accept', '.html,.htm,.txt,text/html,text/plain');
    input.addEventListener('change', function (event) {
      var files = Array.prototype.slice.call((event.target && event.target.files) || []);
      var hasTxt = files.some(function (file) { return /\.txt$/i.test(String(file.name || '')) || String(file.type || '').toLowerCase() === 'text/plain'; });
      if (!hasTxt) return; // Let the immutable v1 HTML importer handle normal HTML-only selections.
      event.preventDefault();
      event.stopImmediatePropagation();
      importFilesThroughV1(files).catch(function (error) {
        console.error('[HTML Studio Plus] TXT import failed:', error);
        toast('One or more files could not be imported.', 'error');
      }).finally(function () { try { input.value = ''; } catch (_) {} });
    }, true);
  }

  function scrollPreviewToHash(hash) {
    var frame = $('previewFrame');
    if (!frame || !frame.contentWindow || !lastPreviewToken || !hash) return false;
    frame.contentWindow.postMessage({
      source: 'unscriptly-html-studio',
      token: lastPreviewToken,
      type: 'NCE_SCROLL_TO',
      hash: String(hash).replace(/^#/, '')
    }, '*');
    return true;
  }

  function capturePreviewMessages() {
    window.addEventListener('message', function (event) {
      var frame = $('previewFrame');
      if (!frame || event.source !== frame.contentWindow) return;
      var msg = event.data || {};
      if (msg.source !== 'unscriptly-html-studio') return;
      if (msg.token) lastPreviewToken = msg.token;
      if (msg.type === 'NCE_SELECTED') {
        selection = msg.element || null;
        document.dispatchEvent(new CustomEvent('htmlstudio:plus-selection', { detail: selection }));
      } else if (msg.type === 'NCE_DESELECTED') {
        selection = null;
        document.dispatchEvent(new CustomEvent('htmlstudio:plus-selection', { detail: null }));
      } else if (msg.type === 'NCE_READY') {
        document.dispatchEvent(new CustomEvent('htmlstudio:plus-preview-ready'));
      }
    });
  }

  function init() {
    var ok = probeV1Core();
    if (!ok) {
      setBadge('error', 'v8.11.0 · V1 CORE PROBE FAILED', 'The unchanged v1 core script loaded but did not bind its known-good controls.');
      return;
    }
    document.documentElement.setAttribute('data-html-studio-plus', 'ready');
    installTxtImport();
    capturePreviewMessages();
    setBadge('ready', 'v8.11.0 · CORE READY', 'The unchanged v1 editor core is running; checking the Apps Script server.');
    verifyServer();
  }

  window.HTMLStudioPlus = {
    version: BUILD,
    toast: toast,
    getSelection: function () { return selection ? Object.assign({}, selection) : null; },
    hasPage: hasPage,
    readSource: readSource,
    withSource: withSource,
    patchSelected: patchSelected,
    styleSelected: styleSelected,
    attrSelected: attrSelected,
    textSelected: textSelected,
    insertHtml: insertHtml,
    ensureStylesheet: ensureStylesheet,
    scrollPreviewToHash: scrollPreviewToHash,
    diagnostics: function () {
      return {
        build: BUILD,
        plus: document.documentElement.getAttribute('data-html-studio-plus') || 'not-ready',
        projects: document.documentElement.getAttribute('data-html-studio-projects') || 'unknown',
        workspace: document.documentElement.getAttribute('data-html-studio-workspace') || 'unknown',
        layers: document.documentElement.getAttribute('data-html-studio-layers') || 'unknown',
        layerBridge: document.documentElement.getAttribute('data-html-studio-layer-bridge') || 'unknown',
        reviewBridge: document.documentElement.getAttribute('data-html-studio-review-bridge') || 'unknown',
        review: document.documentElement.getAttribute('data-html-studio-review') || 'unknown',
        reviewExport: document.documentElement.getAttribute('data-html-studio-review-export') || 'unknown',
        elements: document.documentElement.getAttribute('data-html-studio-elements') || 'unknown',
        media: document.documentElement.getAttribute('data-html-studio-media') || 'unknown',
        gallery: document.documentElement.getAttribute('data-html-studio-gallery') || 'unknown',
        navigation: document.documentElement.getAttribute('data-html-studio-navigation') || 'unknown',
        linking: document.documentElement.getAttribute('data-html-studio-linking') || 'unknown',
        social: document.documentElement.getAttribute('data-html-studio-social') || 'unknown',
        typography: document.documentElement.getAttribute('data-html-studio-typography') || 'unknown',
        chrome: document.documentElement.getAttribute('data-html-studio-chrome') || 'unknown',
        globalStyles: document.documentElement.getAttribute('data-html-studio-global') || 'unknown',
        pngExport: document.documentElement.getAttribute('data-html-studio-png') || 'unknown',
        elementExport: document.documentElement.getAttribute('data-html-studio-element-export') || 'unknown',
        bootErrors: (window.__HTML_STUDIO_BOOT_ERRORS || []).slice()
      };
    }
  };

  try { init(); }
  catch (error) {
    console.error('[HTML Studio Plus] initialization failed:', error);
    setBadge('error', 'v8.11.0 · PLUS ERROR', String(error && error.message || error));
  }
})();
</script>
